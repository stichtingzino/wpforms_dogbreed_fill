name: Generate WordPress Plugin Zip on Main Merge

on:
  push:
    branches:
      - main  # Start only on a push or merge to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to modify files and create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Version & Synchronize Main PHP File
        id: get_version
        run: |
          # 1. Read the version number from the VERSION file and remove spaces/newlines
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Found version in VERSION file: $VERSION"
          
          # Make the variable available for the next steps in the Action
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # 2. Synchronize the version number in the main PHP file of the plugin via Regex (sed)
          # This looks for 'Version: ...' in the WordPress header and replaces it with the correct version
          sed -i -E "s/(Version:[[:space:]]*)[0-9.]+(.*)/\1$VERSION\2/g" wpforms_dogbreed_fill/wpforms_dogbreed_fill.php
          
          echo "Main PHP file successfully synchronized to version $VERSION!"

      - name: Create clean production directory & Zip
        env:
          PLUGIN_SLUG: "wpforms_dogbreed_fill"
        run: |
          # 1. Create a temporary build map
          mkdir -p build/${{ env.PLUGIN_SLUG }}
          
          # 2. Copy the recently updated plugin content to the build map
          rsync -rc --exclude '.git*' ./${{ env.PLUGIN_SLUG }}/ build/${{ env.PLUGIN_SLUG }}/
          
          # 3. Go to the build map and zip the plugin
          cd build
          zip -r ../${{ env.PLUGIN_SLUG }}.zip ${{ env.PLUGIN_SLUG }}
          cd ..

      - name: Upload or Update Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_SLUG: "wpforms_dogbreed_fill"
        run: |
          # Create an official GitHub release with the version number as the tag (e.g., v1.0.1)
          # If the tag already exists, it overwrites the zip file.
          gh release create "v${{ env.VERSION }}" ${{ env.PLUGIN_SLUG }}.zip \
            --title "Release v${{ env.VERSION }}" \
            --notes "Automated production release for version v${{ env.VERSION }}." \
            --overwrite
