name: Generate Python Package Release on Main Merge

on:
  push:
    branches:
      - main  # Start only on a push or merge to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to modify files and create releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Check if the VERSION file has changed
      - name: Check if VERSION changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            version_changed:
              - 'VERSION'

      # 2. If VERSION has changed, wait for update_version to finish
      - name: Wait for Update Version Files
        if: steps.changes.outputs.version_changed == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'update-version'  # The exact name of the job in update_version_files.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10  # Check every 10 seconds

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Use the Python version specified in pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python package
        run: |
          python -m build

      - name: Upload or Update Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(cat VERSION | tr -d '[:space:]')"
          
          # Check if the release already exists on GitHub
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Asset will be updated..."
            # Upload the new package to the existing release and overwrite the old file
            gh release upload "$TAG_NAME" dist/*.tar.gz --clobber
            gh release upload "$TAG_NAME" dist/*.whl --clobber
          else
            echo "Release $TAG_NAME does not exist. New release will be created..."
            # Create a new release including the package
            gh release create "$TAG_NAME" dist/*.tar.gz dist/*.whl \
              --title "Release $TAG_NAME" \
              --notes "Automated Python package release for version $TAG_NAME."
          fi

